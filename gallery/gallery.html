    <!-- Empty gallery container -->

    <header class="gallery-header">
      <div>
        <h1>My Illustrations</h1>
      </div>
      <div class="header-actions">
        <button class="btn-music" id="musicToggle" aria-label="Toggle music">
          🎵
        </button>
        <button class="btn-go-back" id="goBack">← Back</button>
      </div>
    </header>
    <div id="gallery" class="gallery"></div>

    <!-- Modal -->
    <div id="illustration-modal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="closeModal" aria-label="Close modal">×</button>
        <img id="modalImage" src="" alt="" />
        <h3 id="modalTitle"></h3>
        <p id="modalNote"></p>
      </div>
