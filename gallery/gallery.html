<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <video autoplay muted loop id="videoBackground">
      <source src="../gallery/gallery-assets/water.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <div class="sidebar">
      <button class="burger" id="burgerBtn">☰</button>
      <nav id="navMenu" class="nav-menu">
        <a href="#zines">Zines</a>
        <a href="#commissions">Commission Sheet</a>
        <a href="#illustrations">Illustrations</a>

    <!-- Empty gallery container -->
    <div id="gallery" class="gallery"></div>

    <!-- Modal -->
    <div id="illustration-modal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="closeModal" aria-label="Close modal">×</button>
        <img id="modalImage" src="" alt="" />

        <p id="modalNote"></p>
      </div>

    <script src="gallery.js"></script>
