<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amanda's Room</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="bedroom">
        <div id="hint-bubble">
          <p id="hintText"></p>
          <button id="stationYes">Yes</button>
          <button id="stationNo">No</button>
          <p id="hitEnter">press enter to continue</p>
        </div>
        <div id="music-notes" class="music-notes" aria-hidden="true">
          <img src="assets/music.gif" alt="Music playing animation" />
        </div>
        <canvas id="gameCanvas" width="480" height="270"></canvas>
      </div>
    </div>

    <div id="contact-modal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button
          id="close-contact-modal"
          class="modal-close"
          aria-label="Close contact modal"
        >
          ×
        </button>
        <div class="contact-header">
          <div class="contact-avatar"></div>
          <div class="contact-info">
            <h2>Contact me!</h2>
            <p>Email: amandaruazol@email.com</p>
            <p>
              Github:
              <a
                href="https://github.com/amandarzl"
                target="_blank"
                rel="noopener noreferrer"
                >github.com/amandarzl</a
              >
            </p>
            <p>
              LinkedIn:
              <a
                href="https://www.linkedin.com/in/amandaruazol/"
                target="_blank"
                rel="noopener noreferrer"
                >Amanda Ruazol</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <div id="sleep-overlay" class="sleep-overlay" aria-hidden="true">
      <div class="sleep-screen">
        <img src="assets/sleep.gif" alt="Sleeping animation" />
        <p>Sleep mode. Move the mouse to wake up.</p>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
